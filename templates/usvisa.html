<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>US Visa Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css')}}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"
          ><i class="fas fa-passport"></i> US Visa Predictor</a
        >
      </div>
    </nav>
    <section class="hero-section">
      <div class="container-fluid py-5">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-8">
              <div class="card shadow-lg">
                <div class="card-header bg-gradient text-white text-center">
                  <h3 class="mb-0">
                    <i class="fas fa-clipboard-check"></i> US Visa Approval
                    Prediction
                  </h3>
                  <p class="mb-0">
                    Fill in the details below to predict visa approval status
                  </p>
                </div>
                <div class="card-body">
                  <form action="/" method="post">
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="continent" class="form-label"
                          ><i class="fas fa-globe"></i> Continent</label
                        >
                        <select
                          class="form-select"
                          id="continent"
                          name="continent"
                          required
                        >
                          <option value="" disabled selected>
                            Select Continent
                          </option>
                          <option>Asia</option>
                          <option>Africa</option>
                          <option>North America</option>
                          <option>Europe</option>
                          <option>South America</option>
                          <option>Oceania</option>
                        </select>
                      </div>
                      <div class="col-md-6 mb-3">
                        <label for="education_of_employee" class="form-label"
                          ><i class="fas fa-graduation-cap"></i> Education
                          Level</label
                        >
                        <select
                          class="form-select"
                          id="education_of_employee"
                          name="education_of_employee"
                          required
                        >
                          <option value="" disabled selected>
                            Select Education
                          </option>
                          <option>High School</option>
                          <option>Bachelor's</option>
                          <option>Master's</option>
                          <option>Doctorate</option>
                        </select>
                      </div>
                    </div>
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="has_job_experience" class="form-label"
                          ><i class="fas fa-briefcase"></i> Job
                          Experience</label
                        >
                        <select
                          class="form-select"
                          id="has_job_experience"
                          name="has_job_experience"
                          required
                        >
                          <option value="" disabled selected>
                            Has Experience
                          </option>
                          <option>Y</option>
                          <option>N</option>
                        </select>
                      </div>
                      <div class="col-md-6 mb-3">
                        <label for="requires_job_training" class="form-label"
                          ><i class="fas fa-chalkboard-teacher"></i> Requires
                          Training</label
                        >
                        <select
                          class="form-select"
                          id="requires_job_training"
                          name="requires_job_training"
                          required
                        >
                          <option value="" disabled selected>
                            Required Training
                          </option>
                          <option>Y</option>
                          <option>N</option>
                        </select>
                      </div>
                    </div>
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="no_of_employees" class="form-label"
                          ><i class="fas fa-users"></i> Number of
                          Employees</label
                        >
                        <input
                          type="number"
                          class="form-control"
                          id="no_of_employees"
                          name="no_of_employees"
                          min="1"
                          max="100000"
                          placeholder="e.g., 5000"
                          required
                        />
                      </div>
                      <div class="col-md-6 mb-3">
                        <label for="region_of_employment" class="form-label"
                          ><i class="fas fa-map-marker-alt"></i> Region</label
                        >
                        <select
                          class="form-select"
                          id="region_of_employment"
                          name="region_of_employment"
                          required
                        >
                          <option value="" disabled selected>
                            Select Region
                          </option>
                          <option>West</option>
                          <option>Northeast</option>
                          <option>South</option>
                          <option>Midwest</option>
                          <option>Island</option>
                        </select>
                      </div>
                    </div>
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="prevailing_wage" class="form-label"
                          ><i class="fas fa-dollar-sign"></i> Prevailing Wage
                          ($)</label
                        >
                        <input
                          type="number"
                          class="form-control"
                          id="prevailing_wage"
                          name="prevailing_wage"
                          min="0"
                          step="0.01"
                          placeholder="e.g., 50000"
                          required
                        />
                      </div>
                      <div class="col-md-6 mb-3">
                        <label for="unit_of_wage" class="form-label"
                          ><i class="fas fa-calendar-alt"></i> Wage Unit</label
                        >
                        <select
                          class="form-select"
                          id="unit_of_wage"
                          name="unit_of_wage"
                          required
                        >
                          <option value="" disabled selected>
                            Select Unit
                          </option>
                          <option>Year</option>
                          <option>Month</option>
                          <option>Week</option>
                          <option>Hour</option>
                        </select>
                      </div>
                    </div>
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="full_time_position" class="form-label"
                          ><i class="fas fa-clock"></i> Full Time
                          Position</label
                        >
                        <select
                          class="form-select"
                          id="full_time_position"
                          name="full_time_position"
                          required
                        >
                          <option value="" disabled selected>Select</option>
                          <option>Y</option>
                          <option>N</option>
                        </select>
                      </div>
                      <div class="col-md-6 mb-3">
                        <label for="company_age" class="form-label"
                          ><i class="fas fa-building"></i> Company Age
                          (years)</label
                        >
                        <input
                          type="number"
                          class="form-control"
                          id="company_age"
                          name="company_age"
                          min="0"
                          max="200"
                          placeholder="e.g., 10"
                          required
                        />
                      </div>
                    </div>
                    <div class="text-center">
                      <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-search"></i> Predict Visa Status
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
          {% if context %}
          <div class="row justify-content-center mt-4">
            <div class="col-lg-8">
              <div class="alert alert-info text-center" role="alert">
                <h4 class="alert-heading">
                  <i class="fas fa-info-circle"></i> Prediction Result
                </h4>
                <p class="mb-0">{{ context }}</p>
              </div>
            </div>
          </div>
          {% endif %}
        </div>
      </div>
    </section>
    <footer class="bg-dark text-white text-center py-3">
      <p>&copy; 2025 US Visa Predictor. All rights reserved.</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
